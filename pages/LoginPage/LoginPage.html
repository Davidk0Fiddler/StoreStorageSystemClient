<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../backgroundShapes.css" />

    <link rel="stylesheet" href="../modernAlertStyle.css" />

    <title>Bejelentkezés</title>

    <style>
      /* =========================================
   LOGIN CARD
========================================= */

      .login-card {
        width: 100%;
        max-width: 420px;

        background: #ffffff;

        border: 1px solid #e5e7eb;
        border-radius: 20px;

        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);

        overflow: hidden;
      }

      .login-card-body {
        padding: 2.25rem;
      }

      /* =========================================
   LOGIN ICON
========================================= */

      .login-icon-wrapper {
        width: 64px;
        height: 64px;

        display: flex;
        align-items: center;
        justify-content: center;

        margin: 0 auto 1.25rem;

        border-radius: 16px;

        background: #eff6ff;
        color: #2563eb;

        font-size: 2rem;
      }

      /* =========================================
   LOGIN TITLE
========================================= */

      .login-title {
        margin: 0;

        color: #111827;

        font-size: 1.75rem;
        font-weight: 700;

        line-height: 1.2;
      }

      .login-subtitle {
        margin: 0.5rem 0 0;

        color: #6b7280;

        font-size: 0.9rem;

        line-height: 1.5;
      }

      /* =========================================
   LOGIN LABEL
========================================= */

      .login-label {
        margin-bottom: 0.5rem;

        color: #374151;

        font-size: 0.88rem;
        font-weight: 600;
      }

      /* =========================================
   LOGIN INPUT
========================================= */

      .login-input-group {
        border-radius: 10px;

        transition: box-shadow 0.2s ease;
      }

      .login-input-group .input-group-text {
        border-color: #dee2e6;

        background: #f8f9fa;

        color: #6b7280;

        border-radius: 10px 0 0 10px;
      }

      .login-input-group .form-control {
        min-height: 44px;

        border-color: #dee2e6;

        color: #111827;

        transition:
          border-color 0.2s ease,
          box-shadow 0.2s ease;
      }

      .login-input-group .form-control:focus {
        border-color: #86b7fe;

        box-shadow: none;
      }

      .login-input-group:focus-within {
        box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.1);
      }

      /* =========================================
   PASSWORD TOGGLE
========================================= */

      .login-password-toggle {
        min-width: 46px;

        border: 1px solid #dee2e6;
        border-left: 0;

        background: #ffffff;

        color: #6b7280;

        border-radius: 0 10px 10px 0;
      }

      .login-password-toggle:hover {
        background: #f8f9fa;

        color: #2563eb;
      }

      .login-password-toggle:focus {
        box-shadow: none;
      }

      /* =========================================
   LOGIN BUTTON
========================================= */

      .login-button {
        min-height: 46px;

        border: 1px solid #2563eb;
        border-radius: 10px;

        background: #2563eb;
        color: #ffffff;

        font-size: 0.92rem;
        font-weight: 600;

        box-shadow: 0 3px 8px rgba(37, 99, 235, 0.16);

        transition:
          background-color 0.2s ease,
          border-color 0.2s ease,
          box-shadow 0.2s ease,
          transform 0.15s ease;
      }

      .login-button:hover:not(:disabled) {
        background: #1d4ed8;

        border-color: #1d4ed8;

        color: #ffffff;

        transform: translateY(-1px);

        box-shadow: 0 5px 12px rgba(37, 99, 235, 0.22);
      }

      .login-button:active:not(:disabled) {
        transform: translateY(0);
      }

      /* =========================================
   DISABLED LOGIN BUTTON
========================================= */

      .login-button:disabled {
        background: #e5e7eb;

        border-color: #e5e7eb;

        color: #9ca3af;

        box-shadow: none;

        cursor: not-allowed;
      }

      /* =========================================
   TOOLTIP WRAPPER
========================================= */

      .login-button-wrapper {
        display: block;
      }

      /* =========================================
   RESPONSIVE
========================================= */

      @media (max-width: 450px) {
        .login-card-body {
          padding: 1.5rem;
        }

        .login-title {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="background-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
    </div>
    <!--Visszajelzés felhívások-->
    <section class="position-absolute translate-middle my-5 top-0 start-50">
      <div id="liveAlertPlaceholder"></div>
    </section>

    <div
      class="container-fluid d-flex justify-content-center align-items-center vh-100"
    >
      <!--Bejelentkezési panel-->
      <section>
        <div class="login-card">
          <div class="login-card-body">
            <!-- IKON -->
            <div class="login-icon-wrapper">
              <i class="bi bi-person-circle"></i>
            </div>

            <!-- CÍM -->
            <div class="text-center mb-4">
              <h1 class="login-title">Bejelentkezés</h1>

              <p class="login-subtitle">
                Jelentkezzen be a fiókjába a folytatáshoz
              </p>
            </div>

            <form>
              <!-- FELHASZNÁLÓNÉV -->
              <div class="mb-3">
                <label
                  for="login-username-field"
                  class="form-label login-label"
                >
                  Felhasználónév
                </label>

                <div class="input-group login-input-group">
                  <span class="input-group-text">
                    <i class="bi bi-person"></i>
                  </span>

                  <input
                    type="text"
                    class="form-control"
                    id="login-username-field"
                    placeholder="Felhasználónév"
                    autocomplete="username"
                  />
                </div>
              </div>

              <!-- JELSZÓ -->
              <div class="mb-4">
                <label
                  for="login-password-field"
                  class="form-label login-label"
                >
                  Jelszó
                </label>

                <div class="input-group login-input-group">
                  <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                  </span>

                  <input
                    type="password"
                    class="form-control"
                    id="login-password-field"
                    placeholder="Jelszó"
                    autocomplete="current-password"
                  />

                  <button
                    class="btn login-password-toggle"
                    type="button"
                    id="toggle-password-button"
                    aria-label="Jelszó megjelenítése"
                  >
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <!-- BEJELENTKEZÉS -->
              <span
                class="login-button-wrapper"
                data-bs-toggle="tooltip"
                data-bs-placement="top"
                title="Töltsd ki a felhasználónevet és a jelszót!"
              >
                <button
                  type="submit"
                  class="btn login-button w-100"
                  id="login-button"
                  disabled
                >
                  <i class="bi bi-box-arrow-in-right me-2"></i>
                  Bejelentkezés
                </button>
              </span>
            </form>
          </div>
        </div>
      </section>

      <!--Betöltési pörgő-->
      <section id="spinning-overlay" class="d-none">
        <div class="position-absolute top-50 start-50 translate-middle">
          <div
            class="spinner-border text-primary"
            style="width: 3rem; height: 3rem"
            role="status"
          >
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </section>
    </div>
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="LoginPage.js" type="module"></script>
  </body>
</html>
