<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../backgroundShapes.css" />
    <link rel="stylesheet" href="../modernAlertStyle.css" />
    <link rel="stylesheet" href="./Styles/LoginStyle.css" />

    <title>Bejelentkezés</title>
  </head>
  <body>
    <div class="background-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
    </div>
    <!--Visszajelzés felhívások-->
    <section class="position-absolute translate-middle my-5 top-0 start-50">
      <div id="liveAlertPlaceholder"></div>
    </section>

    <div
      class="container-fluid d-flex justify-content-center align-items-center vh-100"
    >
      <!--Bejelentkezési panel-->
      <section>
        <div class="login-card">
          <div class="login-card-body">
            <!-- IKON -->
            <div class="login-icon-wrapper">
              <i class="bi bi-person-circle"></i>
            </div>

            <!-- CÍM -->
            <div class="text-center mb-4">
              <h1 class="login-title">Bejelentkezés</h1>

              <p class="login-subtitle">
                Jelentkezzen be a fiókjába a folytatáshoz
              </p>
            </div>

            <form>
              <!-- FELHASZNÁLÓNÉV -->
              <div class="mb-3">
                <label
                  for="login-username-field"
                  class="form-label login-label"
                >
                  Felhasználónév
                </label>

                <div class="input-group login-input-group">
                  <span class="input-group-text">
                    <i class="bi bi-person"></i>
                  </span>

                  <input
                    type="text"
                    class="form-control"
                    id="login-username-field"
                    placeholder="Felhasználónév"
                    autocomplete="username"
                  />
                </div>
              </div>

              <!-- JELSZÓ -->
              <div class="mb-4">
                <label
                  for="login-password-field"
                  class="form-label login-label"
                >
                  Jelszó
                </label>

                <div class="input-group login-input-group">
                  <span class="input-group-text">
                    <i class="bi bi-lock"></i>
                  </span>

                  <input
                    type="password"
                    class="form-control"
                    id="login-password-field"
                    placeholder="Jelszó"
                    autocomplete="current-password"
                  />

                  <button
                    class="btn login-password-toggle"
                    type="button"
                    id="toggle-password-button"
                    aria-label="Jelszó megjelenítése"
                  >
                    <i class="bi bi-eye"></i>
                  </button>
                </div>
              </div>

              <!-- BEJELENTKEZÉS -->
              <span
                class="login-button-wrapper"
                data-bs-toggle="tooltip"
                data-bs-placement="top"
                title="Töltsd ki a felhasználónevet és a jelszót!"
              >
                <button
                  type="submit"
                  class="btn login-button w-100"
                  id="login-button"
                  disabled
                >
                  <i class="bi bi-box-arrow-in-right me-2"></i>
                  Bejelentkezés
                </button>
              </span>
            </form>
          </div>
        </div>
      </section>

      <!--Betöltési pörgő-->
      <section id="spinning-overlay" class="d-none">
        <div class="position-absolute top-50 start-50 translate-middle">
          <div
            class="spinner-border text-primary"
            style="width: 3rem; height: 3rem"
            role="status"
          >
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </section>
    </div>
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script src="LoginPage.js" type="module"></script>
  </body>
</html>
