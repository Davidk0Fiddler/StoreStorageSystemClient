<!doctype html>
<html lang="hu" data-required-roles="Admin">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="../shared/RoleGuard.js"></script>
    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../backgroundShapes.css" />
    <link rel="stylesheet" href="StatisticsPanel.css" />
    <title>Statisztikák — Termelői bolt</title>
      <link rel="stylesheet" href="../shared/AppFooter.css" />
  </head>
  <body>
    <div class="background-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
    </div>

    <section>
      <div class="statistics-layout">
        <!-- BAL OLDALI NAVBAR -->
        <aside class="statistics-sidebar">
          <nav class="statistics-nav">
            <button
              type="button"
              class="statistics-nav-item active"
              id="income-panel-btn"
              data-panel="income-panel"
            >
              <i class="bi bi-cash-stack"></i>
              <span>Bevételek</span>
            </button>

            <button
              type="button"
              class="statistics-nav-item"
              data-panel="top-products-panel"
              id="top-products-btn"
            >
              <i class="bi bi-trophy"></i>
              <span>Top termékek</span>
            </button>

            <button
              type="button"
              class="statistics-nav-item"
              data-panel="brands-panel"
            >
              <i class="bi bi-tags"></i>
              <span>Márkák</span>
            </button>

            <button
              type="button"
              class="statistics-nav-item"
              data-panel="transactions-panel"
            >
              <i class="bi bi-receipt"></i>
              <span>Tranzakciók</span>
            </button>

            <button
              type="button"
              class="statistics-nav-item"
              data-panel="vat-panel"
            >
              <i class="bi bi-percent"></i>
              <span>ÁFA</span>
            </button>

            <!-- KILÉPÉS -->

            <div class="statistics-nav-spacer"></div>

            <button
              type="button"
              class="statistics-nav-item statistics-nav-logout"
              id="back-to-menu-btn"
            >
              <i class="bi bi-box-arrow-left"></i>
              <span>Kilépés</span>
            </button>
          </nav>
        </aside>

        <!-- TARTALOM -->
        <main
          class="statistics-content"
          id="statistics-content"
          style="max-height: 100vh; overflow-y: scroll"
        ></main>
      </div>
    </section>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="StatisticsPanel.js"></script>
    <script src="../shared/AppFooter.js"></script>
    <script src="../shared/PageTitle.js"></script>
</body>
</html>
