<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="../../node_modules/bootstrap-icons/font/bootstrap-icons.css"
    />
    <title>Nyilvántartó Program</title>
    <link rel="stylesheet" href="LandingPage.css" />
    <link rel="stylesheet" href="../backgroundShapes.css" />
    <link rel="stylesheet" href="../modernAlertStyle.css" />
  </head>
  <body>
    <div class="background-shapes">
      <div class="shape shape-1"></div>
      <div class="shape shape-2"></div>
      <div class="shape shape-3"></div>
      <div class="shape shape-4"></div>
    </div>
    <!-- Felhasználói adatlap -->
    <section>
      <div class="modal fade" tabindex="-1" id="user-data-modal">
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title">Felhasználó adatai</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body text-center">
              <i class="bi bi-person-circle display-1 mb-3"></i>
              <p>
                Felhasználónév: <span id="user-name" class="fw-bold"></span>
              </p>
              <p>
                Jogosultságkör megnevezése:
                <span id="role-name" class="fw-bold"></span>
              </p>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Bezárás
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Fejléc -->
    <section
      class="d-flex align-items-center justify-content-between border-bottom"
    >
      <p class="h4 pt-2 ps-2 fw-bold" id="brand-name"></p>
      <p
        class="btn btn-danger mt-3 me-3 py-2 px-3 fw-bold"
        id="exit-app-button"
      >
        Kilépés
      </p>
    </section>

    <!-- kezelő felület gombokkal -->
    <section>
      <div class="container-fluid">
        <div
          class="row justify-content-center g-3 p-3"
          id="button-container"
        ></div>
      </div>
    </section>

    <!-- Lejárati alert -->
    <section
      class="position-absolute translate-middle my-5 top-0 start-50"
      style="z-index: 9999"
    >
      <div
        class="alert alert-danger clickable-alert position-relative overflow-hidden d-flex align-items-center gap-3 mb-0 rounded-4 shadow-sm d-none"
        role="button"
        tabindex="0"
        id="expiration-alert"
      >
        <div
          class="d-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-3 flex-shrink-0"
          style="width: 44px; height: 44px"
        >
          <i class="bi bi-exclamation-triangle-fill fs-5"></i>
        </div>

        <div class="flex-grow-1">
          <span class="fw-semibold"> Hamarosan lejáró áru van készleten! </span>

          <span class="small d-block mt-1"> Kattints a továbbiakhoz. </span>
        </div>

        <i class="bi bi-chevron-right fs-5"></i>

        <!-- Időzítő vonal -->
        <div
          id="expiration-alert-progress"
          class="position-absolute bottom-0 start-0 w-100"
          style="height: 4px; background: var(--bs-danger)"
        ></div>
      </div>
    </section>

    <section>
      <div
        class="modal fade"
        id="expiring-products-modal"
        tabindex="-1"
        aria-labelledby="expiring-products-modal-label"
      >
        <div class="modal-dialog modal-fullscreen">
          <div class="modal-content border-0">
            <!-- Fejléc -->
            <div class="modal-header px-4 py-3 border-bottom">
              <div class="d-flex align-items-center gap-3">
                <div
                  class="d-flex align-items-center justify-content-center bg-danger-subtle text-danger rounded-3"
                  style="width: 48px; height: 48px"
                >
                  <i class="bi bi-exclamation-triangle-fill fs-4"></i>
                </div>

                <div>
                  <h4
                    class="modal-title fw-semibold mb-1"
                    id="expiring-products-modal-label"
                  >
                    Hamarosan lejáró áruk
                  </h4>

                  <p class="text-body-secondary mb-0">
                    Az alábbi termékek hamarosan elérik a lejárati dátumukat.
                  </p>
                </div>
              </div>

              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Bezárás"
              ></button>
            </div>

            <!-- Tartalom -->
            <div class="modal-body bg-body-tertiary p-4">
              <div class="container-fluid">
                <!-- Lista -->
                <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                  <!-- Fejléc -->
                  <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                      <thead class="table-light">
                        <tr>
                          <th class="px-4 py-3" style="width: 90px">Kép</th>

                          <th class="py-3">Termék</th>

                          <th class="py-3 text-center">Mennyiség</th>

                          <th class="py-3 text-center">Állapot</th>

                          <th class="py-3 text-center">Lejárati dátum</th>
                        </tr>
                      </thead>

                      <tbody id="expiring-products-table-body">
                        <!-- JS tölti fel -->
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            </div>

            <!-- Lábléc -->
            <div class="modal-footer border-top px-4 py-3">
              <span
                class="text-body-secondary me-auto"
                id="expiring-products-count"
              >
                0 termék
              </span>

              <button
                type="button"
                class="btn btn-light border rounded-3 px-4"
                data-bs-dismiss="modal"
              >
                <i class="bi bi-x-lg me-1"></i>
                Bezárás
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <script src="../../node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="LandingPage.js"></script>
  </body>
</html>
