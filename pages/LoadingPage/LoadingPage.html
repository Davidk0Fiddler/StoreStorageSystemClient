<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Termelői bolt — Indítás</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Segoe UI", sans-serif;
        color: #315d4e;
        background: #f7f5e9;
        font-synthesis: none;
      }

      * { box-sizing: border-box; }

      body {
        width: 100vw;
        min-width: 320px;
        height: 100vh;
        min-height: 420px;
        margin: 0;
        overflow: hidden;
        display: grid;
        place-items: center;
        background:
          radial-gradient(ellipse at 50% 44%, rgb(255 255 250 / 96%) 0%, rgb(250 249 238 / 96%) 45%, #eef1df 100%);
      }

      .version-badge {
        position: fixed;
        z-index: 1;
        top: 28px;
        right: 32px;
        padding: 9px 15px;
        border: 1px solid rgb(68 105 77 / 14%);
        border-radius: 999px;
        background: rgb(255 255 250 / 82%);
        color: #59705c;
        box-shadow: 0 5px 18px rgb(49 93 78 / 6%);
        font-size: 13px;
        font-weight: 650;
        letter-spacing: .01em;
      }

      .splash {
        width: min(88vw, 820px);
        display: grid;
        place-items: center;
        padding-bottom: 8vh;
        animation: fade-in 650ms ease-out both;
      }

      .logo {
        display: block;
        width: min(100%, 680px);
        max-height: 52vh;
        object-fit: contain;
        border-radius: 12px;
        filter: drop-shadow(0 16px 24px rgb(58 75 49 / 12%));
      }

      .startup-footer {
        position: fixed;
        right: clamp(22px, 5vw, 76px);
        bottom: clamp(22px, 5vh, 46px);
        left: clamp(22px, 5vw, 76px);
        max-width: 1320px;
        margin-inline: auto;
      }

      .progress-row {
        display: flex;
        align-items: center;
        gap: 22px;
      }

      .progress-track {
        position: relative;
        flex: 1 1 auto;
        height: 10px;
        overflow: hidden;
        border: 1px solid rgb(73 108 79 / 12%);
        border-radius: 999px;
        background: #e4e9d8;
        box-shadow: inset 0 1px 2px rgb(47 76 53 / 8%);
      }

      .progress-value {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #77a55a 0%, #a8b94c 55%, #e69a4d 100%);
        transition: width 300ms ease;
      }

      .launch-button {
        flex: 0 0 auto;
        min-width: 164px;
        min-height: 54px;
        padding: 0 24px;
        border: 0;
        border-radius: 14px;
        background: #315d4e;
        color: #fff;
        box-shadow: 0 9px 20px rgb(49 93 78 / 20%);
        font: inherit;
        font-size: 16px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 160ms ease, transform 160ms ease, box-shadow 160ms ease, opacity 160ms ease;
      }

      .launch-button:not(:disabled):hover {
        transform: translateY(-1px);
        background: #254b3e;
        box-shadow: 0 12px 22px rgb(49 93 78 / 24%);
      }

      .launch-button:not(:disabled):focus-visible {
        outline: 3px solid #e69a4d;
        outline-offset: 4px;
      }

      .launch-button:disabled {
        opacity: .52;
        cursor: not-allowed;
        box-shadow: none;
      }

      .status-line {
        min-height: 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 12px 2px 0;
        color: #617263;
        font-size: 13px;
      }

      .status-current {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-weight: 650;
      }

      .status-indicator {
        width: 8px;
        height: 8px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #e69a4d;
        box-shadow: 0 0 0 4px rgb(230 154 77 / 14%);
      }

      .status-current[data-state="ready"] .status-indicator {
        background: #6e9b59;
        box-shadow: 0 0 0 4px rgb(110 155 89 / 14%);
      }

      .status-current[data-state="error"] .status-indicator {
        background: #c95a4b;
        box-shadow: 0 0 0 4px rgb(201 90 75 / 14%);
      }

      .status-hint {
        color: #89927f;
        text-align: right;
      }

      .credit {
        position: fixed;
        right: 16px;
        bottom: 8px;
        margin: 0;
        color: #8c9583;
        font-size: 10px;
      }

      @keyframes fade-in {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @media (max-width: 620px) {
        .version-badge { top: 18px; right: 18px; font-size: 12px; }
        .splash { width: 92vw; padding-bottom: 12vh; }
        .startup-footer { right: 20px; bottom: 28px; left: 20px; }
        .progress-row { gap: 12px; }
        .launch-button { min-width: 126px; min-height: 50px; padding-inline: 16px; font-size: 14px; }
        .status-line { align-items: flex-start; font-size: 12px; }
        .status-hint { max-width: 45%; }
        .credit { display: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: .01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: .01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <div class="version-badge" id="version-label">Verzió: …</div>

    <main class="splash" aria-label="Termelői bolt indítása">
      <img
        class="logo"
        src="../../assets/logo-animated.gif"
        alt="Termelői Bolt logó"
      />
    </main>

    <footer class="startup-footer" aria-label="Indítás állapota">
      <div class="progress-row">
        <div
          class="progress-track"
          role="progressbar"
          aria-label="Alkalmazás előkészítése"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div class="progress-value"></div>
        </div>
        <button class="launch-button" id="launch-button" type="button" disabled>
          Indítás…
        </button>
      </div>

      <div class="status-line" role="status" aria-live="polite">
        <span class="status-current" id="status-current" data-state="loading">
          <span class="status-indicator" aria-hidden="true"></span>
          <span id="status-message">Verziószám ellenőrzése…</span>
        </span>
        <span class="status-hint" id="status-hint">A rendszer előkészítése folyamatban</span>
      </div>
    </footer>

    <p class="credit">Logót készítette: Lieb Sára</p>

    <script>
      const minimumStartupDuration = 10_000;
      const updateCheckTimeout = 7_000;
      const startedAt = performance.now();
      const progressTrack = document.querySelector(".progress-track");
      const progressValue = document.querySelector(".progress-value");
      const launchButton = document.getElementById("launch-button");
      const statusCurrent = document.getElementById("status-current");
      const statusMessage = document.getElementById("status-message");
      const statusHint = document.getElementById("status-hint");
      let launchLocked = false;
      let applicationLaunching = false;
      let startupReady = false;
      let startupInfo = null;
      let updateState = { phase: "disabled", percent: 0 };
      let finishUpdateCheck;
      const updateCheckFinished = new Promise((resolve) => {
        finishUpdateCheck = resolve;
      });

      function setProgress(value) {
        const safeValue = Math.max(0, Math.min(100, Math.round(value)));
        progressValue.style.width = `${safeValue}%`;
        progressTrack.setAttribute("aria-valuenow", String(safeValue));
      }

      function setStatus(message, hint, state = "loading") {
        statusMessage.textContent = message;
        statusHint.textContent = hint;
        statusCurrent.dataset.state = state;
      }

      function updateProgressFromElapsedTime() {
        if (launchLocked || startupReady || updateState.phase === "downloading") return;
        const elapsed = performance.now() - startedAt;
        setProgress(Math.min(94, (elapsed / minimumStartupDuration) * 94));
      }

      const progressTimer = window.setInterval(updateProgressFromElapsedTime, 100);

      function updateLaunchButton() {
        if (launchLocked) return;
        const updateAvailable = updateState.phase === "available";
        launchButton.textContent = updateAvailable ? "Frissítés" : "Indulás";
        launchButton.disabled = !startupReady;
      }

      function applyUpdateState(state) {
        if (!state || applicationLaunching) return;
        updateState = state;

        switch (state.phase) {
          case "checking":
            setStatus("Frissítések ellenőrzése…", "Kapcsolat a frissítési tárhellyel");
            break;
          case "available":
            setStatus("Új verzió érhető el", `Verzió ${state.version} tölthető le`, "ready");
            finishUpdateCheck();
            break;
          case "current":
            setStatus("Nincs új frissítés", "A telepített verzió naprakész", "ready");
            finishUpdateCheck();
            break;
          case "downloading": {
            const percent = Math.max(0, Math.min(100, Math.round(state.percent || 0)));
            setProgress(percent);
            setStatus("Frissítés letöltése…", `${percent}% kész`);
            launchButton.textContent = `Frissítés ${percent}%`;
            launchButton.disabled = true;
            break;
          }
          case "downloaded":
            setProgress(100);
            setStatus("Frissítés letöltve", "Az alkalmazás újraindul a frissítéshez", "ready");
            launchButton.textContent = "Frissítés kész";
            launchButton.disabled = true;
            break;
          case "error":
            setStatus("A frissítési tárhely nem érhető el", "A jelenlegi verzióval továbbindulhat", "error");
            finishUpdateCheck();
            break;
          default:
            setStatus("Alkalmazás előkészítése…", "A jelenlegi verzió indítható");
            finishUpdateCheck();
        }

        updateLaunchButton();
      }

      const unsubscribeUpdateStatus = window.startup?.onUpdateStatus?.(applyUpdateState);

      async function prepareApplication() {
        try {
          startupInfo = await window.startup.getInfo();
          const version = startupInfo?.version || "ismeretlen";
          document.getElementById("version-label").textContent = `Verzió: ${version}`;
          if (!startupInfo?.updateManagerEnabled) {
            updateState = { phase: "disabled", percent: 0 };
            setStatus("Verzió ellenőrizve", `Telepített verzió: ${version}`);
          } else {
            applyUpdateState(startupInfo.updater);
          }
        } catch {
          document.getElementById("version-label").textContent = "Verzió: ismeretlen";
          updateState = { phase: "error", percent: 0 };
          setStatus("A verziószám nem érhető el", "Az alkalmazás ettől még elindítható", "error");
        }

        if (updateState.phase === "checking") {
          const elapsed = performance.now() - startedAt;
          await Promise.race([
            updateCheckFinished,
            new Promise((resolve) => setTimeout(resolve, Math.max(0, updateCheckTimeout - elapsed))),
          ]);
          if (updateState.phase === "checking") {
            updateState = { phase: "error", percent: 0 };
            setStatus("A frissítési tárhely nem válaszol", "A jelenlegi verzióval továbbindulhat", "error");
          }
        }

        const elapsed = performance.now() - startedAt;
        const remaining = Math.max(0, minimumStartupDuration - elapsed);
        await new Promise((resolve) => setTimeout(resolve, remaining));

        window.clearInterval(progressTimer);
        startupReady = true;
        if (updateState.phase !== "available") {
          setProgress(100);
          if (updateState.phase === "current") {
            setStatus("Az alkalmazás indításra kész", "A telepített verzió naprakész", "ready");
          } else if (updateState.phase === "error") {
            setStatus("Az alkalmazás indításra kész", "A jelenlegi verzióval továbbindulhat", "error");
          } else {
            setStatus("Az alkalmazás indításra kész", "A folytatáshoz kattintson az Indulás gombra", "ready");
          }
        }
        updateLaunchButton();
        launchButton.focus();
      }

      launchButton.addEventListener("click", async () => {
        if (launchButton.disabled || launchLocked) return;
        launchLocked = true;
        launchButton.disabled = true;
        window.clearInterval(progressTimer);

        if (updateState.phase === "available") {
          launchButton.textContent = "Frissítés…";
          setStatus("Frissítés indítása…", "A letöltés elkezdődik", "loading");
          const result = await window.startup.downloadUpdate();
          if (!result?.success) {
            launchLocked = false;
            updateState = { phase: "error", percent: 0 };
            setStatus("A frissítés nem tölthető le", "A jelenlegi verzióval továbbindulhat", "error");
            updateLaunchButton();
          }
          return;
        }

        applicationLaunching = true;
        unsubscribeUpdateStatus?.();
        launchButton.textContent = "Indítás…";
        setStatus("Az alkalmazás indul…", "Kérjük, várjon", "loading");
        setTimeout(() => {
          window.location.href = "../LoginPage/LoginPage.html";
        }, 250);
      });

      prepareApplication();
    </script>
    <script src="../shared/PageTitle.js"></script>
  </body>
</html>
